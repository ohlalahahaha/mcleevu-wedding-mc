name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser proof dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run candlelight artifact proof
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/static-server.mjs deploy-candle > /tmp/lee-artifact-server.log 2>&1 &
          ART_PID=$!
          trap 'kill $ART_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 1; done
          ARTIFACT_URL=http://127.0.0.1:4174 node scripts/artifact-proof.mjs
      - name: Upload candlelight artifact proof
        uses: actions/upload-artifact@v4
        with:
          name: lee-artifact-proof-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/lee-*
          if-no-files-found: error
          retention-days: 7
      - name: Upload cloud build
        uses: actions/upload-artifact@v4
        with:
          name: lee-client-build-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
