name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser proof dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Run desktop and phone proof
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/lee-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/client-proof.mjs
      - name: Upload client proof
        uses: actions/upload-artifact@v4
        with:
          name: lee-client-proof-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Upload cloud build
        uses: actions/upload-artifact@v4
        with:
          name: lee-client-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
